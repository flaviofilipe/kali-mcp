services:
  kali-mcp-box:
    build:
      context: .
      dockerfile: Dockerfile
    image: kali-mcp-box:latest
    container_name: kali-mcp-box
    tty: true
    restart: unless-stopped
    # Limit resources so heavy scans don't consume the entire host
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    networks:
      - default
      - pentest-lab

networks:
  pentest-lab:
    external: true
