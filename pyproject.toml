[project]
name = "kali-mcp"
version = "0.1.0"
description = "MCP server that bridges Claude to an isolated Kali Linux container for automated, allowlisted web application and infrastructure penetration testing — recon, enumeration, web analysis, exploitation, and reporting."
requires-python = ">=3.13"
dependencies = [
    "docker>=7.1.0",
    "fastmcp>=3.3.1",
    "mcp>=1.27.1",
    "pydantic>=2.13.4",
]
